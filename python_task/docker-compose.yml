version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} 
      MYSQL_DATABASE: ${DB_NAME}        
    volumes:
      - db-data:/var/lib/mysql 

  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    stdin_open: true
    tty: true
volumes:
  db-data: